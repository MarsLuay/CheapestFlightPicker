name: Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'workspace/app/package-lock.json'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm run test
