name: Enable hosted search once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enable-hosted-search-once.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch hosted search behavior
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("workspace/app/web/src/App.tsx")
          text = path.read_text()

          def replace_exact(old: str, new: str, expected: int = 1) -> None:
              global text
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"Expected {expected} occurrence(s), found {actual}: {old[:120]!r}")
              text = text.replace(old, new, expected)

          replace_exact("function isRateLimitSearchError(message: string): boolean {\n  return /rate.?limit|too many requests|temporarily rate limited/iu.test(message);\n}\n", "function isRateLimitSearchError(message: string): boolean {\n  return /rate.?limit|too many requests|temporarily rate limited/iu.test(message);\n}\n\nfunction getHostedAwareSearchError(\n  message: string,\n  hostedApiMode: boolean\n): string {\n  return hostedApiMode && isRateLimitSearchError(message)\n    ? hostedSearchUnavailableMessage\n    : message;\n}\n")
          replace_exact("    const shouldBlockHostedSearch = hostedApiMode;\n    const validationError = shouldBlockHostedSearch\n      ? null\n      : getSearchValidationError(submittedRequest);\n", "    const validationError = getSearchValidationError(submittedRequest);\n")
          replace_exact("    const shouldBlockHostedSearch = hostedApiMode;\n    const validationError = shouldBlockHostedSearch\n      ? null\n      : routeRequests.map(getSearchValidationError).find(Boolean) ?? null;\n", "    const validationError =\n      routeRequests.map(getSearchValidationError).find(Boolean) ?? null;\n")
          replace_exact("    if (shouldBlockHostedSearch) {\n      setLivePreviewSummary(null);\n      setHasCompletedSearch(false);\n      setResumeSearchState(null);\n      setError(hostedSearchUnavailableMessage);\n      return;\n    }\n\n", "", expected=2)
          replace_exact("      setError(errorMessage);\n      setSummary(null);\n", "      const displayError = getHostedAwareSearchError(\n        errorMessage,\n        hostedApiMode\n      );\n\n      setError(displayError);\n      setSummary(null);\n")
          replace_exact("              error: errorMessage,\n", "              error: displayError,\n")
          replace_exact("        setUpgradeFareBox(\n          shouldBlockHostedSearch\n            ? null\n            : createInitialUpgradeFareCardState(response.summary, submittedRequest)\n        );\n", "        setUpgradeFareBox(\n          createInitialUpgradeFareCardState(response.summary, submittedRequest)\n        );\n")
          replace_exact("      setUpgradeSearchRequests(\n        shouldBlockHostedSearch\n          ? []\n          : buildHigherCabinSearchRequests(submittedRequest)\n      );\n", "      setUpgradeSearchRequests(\n        buildHigherCabinSearchRequests(submittedRequest)\n      );\n")
          replace_exact("        searchFailures.push(\n          `${routeRequest.origin} -> ${routeRequest.destination}: ${response.error}`\n        );\n", "        const routeError = getHostedAwareSearchError(\n          response.error,\n          hostedApiMode\n        );\n        searchFailures.push(\n          `${routeRequest.origin} -> ${routeRequest.destination}: ${routeError}`\n        );\n")
          replace_exact("      setError(message);\n      setSummary(null);\n      setLivePreviewSummary(bestSummary);\n", "      setError(getHostedAwareSearchError(message, hostedApiMode));\n      setSummary(null);\n      setLivePreviewSummary(bestSummary);\n")

          path.write_text(text)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workspace/app/package-lock.json

      - name: Install dependencies
        working-directory: workspace/app
        run: npm ci

      - name: Type check
        working-directory: workspace/app
        run: npm run check

      - name: Test
        working-directory: workspace/app
        run: npm test

      - name: Build
        working-directory: workspace/app
        run: npm run build

      - name: Commit source update and remove one-time workflow
        run: |
          rm .github/workflows/enable-hosted-search-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace/app/web/src/App.tsx .github/workflows/enable-hosted-search-once.yml
          git commit -m "fix: enable hosted flight searches"
          git push origin HEAD:main
